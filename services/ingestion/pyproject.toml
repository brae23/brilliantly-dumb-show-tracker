[project]
name = "ingestion"
version = "0.1.0"
description = "YouTube podcast RAG pipeline"
readme = "README.md"
authors = [
    { name = "Brendan Rae", email = "brae23hockey@gmail.com" }
]
requires-python = ">=3.11, <3.13"

dependencies = [
    "torch==2.5.1+cu121",
    "torchaudio==2.5.1+cu121",
    "numpy<2.0.0",
    "yt-dlp",
    "huggingface_hub",
    "setuptools",
    "whisperx",
]

[tool.uv]
index-strategy = "unsafe-first-match"

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
torchaudio = [{ index = "pytorch-cuda" }]

[project.scripts]
ingestion = "ingestion.pipeline:run_pipeline"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
